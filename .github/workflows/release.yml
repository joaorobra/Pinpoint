name: Release

# Builds the app and publishes installers to a GitHub Release
# whenever you push a version tag (e.g. v0.1.0).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Add more rows here later for macOS, e.g.:
          # - platform: macos-latest
          #   args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""
          # tauri.conf.json's bundle targets are the Windows installers, so pick Linux bundles
          # here. The AppImage is what the in-app updater replaces in place; the .deb is for
          # manual installs. 22.04 keeps the AppImage's glibc floor low enough for older distros.
          - platform: ubuntu-22.04
            args: "--bundles appimage,deb"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update package so the in-app updater trusts it.
          # Add these in repo Settings → Secrets and variables → Actions.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "PINPOINT ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install PINPOINT. Existing desktop installs will offer this update automatically."
          releaseDraft: true
          prerelease: false
          # Publishes latest.json (the updater manifest) alongside the installers.
          includeUpdaterJson: true
          args: ${{ matrix.args }}
